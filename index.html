<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Světový Atlas - Přehled zemí světa</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; line-height: 1.6; }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 2.2rem; color: #1e3a8a; margin-bottom: 8px; }
    header p { color: var(--text-muted); }

    .user-info { background: #dbeafe; color: #1e40af; padding: 10px 15px; border-radius: 8px; max-width: 900px; margin: 0 auto 20px auto; font-size: 0.9rem; text-align: center; }

    .controls { display: flex; gap: 15px; max-width: 900px; margin: 0 auto 30px auto; flex-wrap: wrap; }
    .controls input, .controls select { flex: 1; min-width: 200px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none; }
    .controls input:focus, .controls select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }

    .container { max-width: 900px; margin: 0 auto; }
    
    .loading { text-align: center; padding: 50px; font-size: 1.2rem; color: var(--text-muted); }

    .country-card { background: var(--card-bg); border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: grid; grid-template-columns: 1fr 1.5fr; gap: 25px; margin-bottom: 30px; }
    @media (max-width: 768px) { .country-card { grid-template-columns: 1fr; } }

    .flag-section { text-align: center; }
    .flag-section img.flag { width: 100%; max-width: 300px; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .flag-section .coat { width: 60px; margin-top: 15px; opacity: 0.8; }

    .details-section h2 { font-size: 2rem; color: #111827; margin-bottom: 5px; }
    .details-section .official-name { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 15px; font-style: italic; }

    .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .info-item { background: #f9fafb; padding: 10px; border-radius: 6px; border: 1px solid var(--border); }
    .info-item label { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .info-item span { font-weight: 600; color: #374151; font-size: 1rem; }

    .currency-box { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    .currency-box strong { display: block; font-size: 1.05rem; }

    .map-btn { display: inline-block; background: var(--primary); color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600; transition: background 0.2s; }
    .map-btn:hover { background: #1d4ed8; }

    .map-frame { margin-top: 20px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); height: 250px; }
    .map-frame iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>

  <header>
    <h1>🌍 Světový Atlas Zemí</h1>
    <p>Aktuální přehled o všech státech světa pro cestovatele i studenty</p>
  </header>

  <div class="user-info" id="userInfo">
    Načítám nastavení...
  </div>

  <div class="controls">
    <select id="countrySelect">
      <option value="">-- Načítám seznam zemí... --</option>
    </select>
    <input type="text" id="searchInput" placeholder="🔎 Rychlé vyhledávání země...">
    <select id="regionFilter">
      <option value="ALL">Všechny kontinenty</option>
      <option value="Europe">Evropa</option>
      <option value="Asia">Asie</option>
      <option value="Africa">Afrika</option>
      <option value="Americas">Amerika</option>
      <option value="Oceania">Oceánie</option>
    </select>
  </div>

  <div class="container" id="app">
    <div class="loading" id="loadingText">Načítám data o zemích světa...</div>
  </div>

  <script>
    let countriesData = [];
    let userCurrency = 'CZK';
    let userCountry = 'CZ';
    let exchangeRates = {};

    async function init() {
      // Nenačítání IP nesmí zablokovat aplikaci
      fetchUserLocation().then(() => fetchExchangeRates());
      
      // Načteme data o zemích
      await fetchCountries();
    }

    async function fetchUserLocation() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        if (res.ok) {
          const data = await res.json();
          if (data && data.currency) {
            userCurrency = data.currency;
            userCountry = data.country_code;
            document.getElementById('userInfo').innerHTML = `📍 Vaše poloha: <strong>${data.country_name || 'Neznámá'} (${userCountry})</strong> | Měna: <strong>${userCurrency}</strong>`;
            return;
          }
        }
      } catch (e) {
        console.warn("Lokalizace se nezdařila:", e);
      }
      document.getElementById('userInfo').innerHTML = `📍 Nastavena měna: <strong>${userCurrency}</strong>`;
    }

    async function fetchExchangeRates() {
      try {
        const res = await fetch(`https://open.er-api.com/v6/latest/${userCurrency}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.rates) {
            exchangeRates = data.rates;
            // Obnovíme zobrazení pokud už je země vykreslená
            const currentCca3 = document.getElementById('countrySelect').value;
            if (currentCca3) {
              const selected = countriesData.find(c => (c.cca3 || c.alpha3Code) === currentCca3);
              if (selected) renderCountryDetail(selected);
            }
          }
        }
      } catch (e) {
        console.warn("Kurzy nedostupné:", e);
      }
    }

    async function fetchCountries() {
      // 3 různé vysoce dostupné zdroje dat pro 100% spolehlivost
      const apiSources = [
        'https://cdn.jsdelivr.net/npm/restcountries-api-data@3.1.0/all.json',
        'https://raw.githubusercontent.com/mledoze/countries/master/dist/countries.json',
        'https://restcountries.com/v3.1/all'
      ];

      for (const url of apiSources) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              countriesData = data;
              break;
            }
          }
        } catch (e) {
          console.warn(`Nepodařilo se načíst z ${url}:`, e);
        }
      }

      if (countriesData.length === 0) {
        document.getElementById('app').innerHTML = `
          <div class="loading" style="color: #dc2626; background: #fee2e2; padding: 20px; border-radius: 8px;">
            ⚠️ <strong>Chyba při načítání dat.</strong> Zkuste obnovit stránku za několik sekund.
          </div>`;
        return;
      }

      // Seřazení podle jména
      countriesData.sort((a, b) => {
        const nameA = a.name?.common || a.name || '';
        const nameB = b.name?.common || b.name || '';
        return nameA.localeCompare(nameB);
      });

      populateSelect(countriesData);

      // Vybereme výchozí zemi (CZ nebo první)
      const initialCountry = countriesData.find(c => (c.cca2 || c.alpha2Code) === userCountry) || 
                             countriesData.find(c => (c.cca2 || c.alpha2Code) === 'CZ') || 
                             countriesData[0];
      
      if (initialCountry) {
        const code = initialCountry.cca3 || initialCountry.alpha3Code;
        document.getElementById('countrySelect').value = code;
        renderCountryDetail(initialCountry);
      }
    }

    function populateSelect(countries) {
      const select = document.getElementById('countrySelect');
      select.innerHTML = '';
      countries.forEach(c => {
        const opt = document.createElement('option');
        const code = c.cca3 || c.alpha3Code;
        const commonName = c.name?.common || c.name || 'Neznámý stát';
        const officialName = c.name?.official || c.officialName || '';
        opt.value = code;
        opt.textContent = officialName ? `${commonName} (${officialName})` : commonName;
        select.appendChild(opt);
      });
    }

    function renderCountryDetail(country) {
      const app = document.getElementById('app');
      
      let currencyText = "Není k dispozici";
      let conversionText = "";

      // Zpracování měny z různých formátů API
      if (country.currencies) {
        if (Array.isArray(country.currencies)) {
          currencyText = country.currencies.map(c => `${c.name} (${c.symbol || c.code})`).join(', ');
          const first = country.currencies[0]?.code;
          if (first && exchangeRates[first]) {
            const rate = (1 / exchangeRates[first]).toFixed(2);
            conversionText = `1 ${first} ≈ <strong>${rate} ${userCurrency}</strong>`;
          }
        } else {
          const currKeys = Object.keys(country.currencies);
          currencyText = currKeys.map(k => `${country.currencies[k].name || k} (${country.currencies[k].symbol || k})`).join(', ');
          const mainCurrKey = currKeys[0];
          if (exchangeRates[mainCurrKey]) {
            const rateToUser = (1 / exchangeRates[mainCurrKey]).toFixed(2);
            conversionText = `1 ${mainCurrKey} ≈ <strong>${rateToUser} ${userCurrency}</strong>`;
          } else if (mainCurrKey === userCurrency) {
            conversionText = `Domovská měna (1 ${mainCurrKey} = 1 ${userCurrency})`;
          }
        }
      }

      // Jazyky
      let languages = 'Neuvedeno';
      if (country.languages) {
        languages = Array.isArray(country.languages) 
          ? country.languages.map(l => l.name || l).join(', ') 
          : Object.values(country.languages).join(', ');
      }

      // Hlavní město
      const capital = Array.isArray(country.capital) ? country.capital.join(', ') : (country.capital || 'Neuvedeno');

      // Vlajky a znak
      const flagSrc = country.flags?.svg || country.flags?.png || country.flag || '';
      const coatSrc = country.coatOfArms?.svg || country.coatOfArms?.png || '';

      // Souřadnice & Mapy
      const lat = country.latlng ? country.latlng[0] : 0;
      const lng = country.latlng ? country.latlng[1] : 0;
      const mapEmbedUrl = `https://maps.google.com/maps?q=${lat},${lng}&z=4&output=embed`;
      const googleMapsUrl = country.maps?.googleMaps || `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

      const commonName = country.name?.common || country.name || 'Neznámý stát';
      const officialName = country.name?.official || country.officialName || '';

      app.innerHTML = `
        <div class="country-card">
          <div class="flag-section">
            ${flagSrc ? `<img class="flag" src="${flagSrc}" alt="Vlajka ${commonName}">` : 'Bez vlajky'}
            ${coatSrc ? `<br><img class="coat" src="${coatSrc}" alt="Státní znak">` : ''}
          </div>
          
          <div class="details-section">
            <h2>${commonName}</h2>
            <div class="official-name">${officialName}</div>

            <div class="currency-box">
              💱 <strong>Měna: ${currencyText}</strong>
              ${conversionText ? `<div style="margin-top: 4px; font-size: 0.9rem;">${conversionText}</div>` : ''}
            </div>

            <div class="grid-info">
              <div class="info-item">
                <label>Hlavní město</label>
                <span>${capital}</span>
              </div>
              <div class="info-item">
                <label>Populace</label>
                <span>${country.population ? country.population.toLocaleString('cs-CZ') : 'Neuvedeno'}</span>
              </div>
              <div class="info-item">
                <label>Rozloha</label>
                <span>${country.area ? country.area.toLocaleString('cs-CZ') + ' km²' : 'Neuvedeno'}</span>
              </div>
              <div class="info-item">
                <label>Region</label>
                <span>${country.region || 'Neuvedeno'} (${country.subregion || ''})</span>
              </div>
            </div>

            <div style="margin-bottom: 15px;">
              <strong>🗣 Jazyky:</strong> ${languages}
            </div>

            <a class="map-btn" href="${googleMapsUrl}" target="_blank" rel="noopener">🗺 Otevřít v Google Mapách ↗</a>
          </div>
        </div>

        <div class="map-frame">
          <iframe src="${mapEmbedUrl}" loading="lazy"></iframe>
        </div>
      `;
    }

    document.getElementById('countrySelect').addEventListener('change', (e) => {
      const selected = countriesData.find(c => (c.cca3 || c.alpha3Code) === e.target.value);
      if (selected) renderCountryDetail(selected);
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      const filtered = countriesData.filter(c => {
        const cName = c.name?.common || c.name || '';
        const oName = c.name?.official || c.officialName || '';
        return cName.toLowerCase().includes(term) || oName.toLowerCase().includes(term);
      });
      populateSelect(filtered);
      if (filtered.length > 0) renderCountryDetail(filtered[0]);
    });

    document.getElementById('regionFilter').addEventListener('change', (e) => {
      const region = e.target.value;
      const filtered = region === 'ALL' ? countriesData : countriesData.filter(c => c.region === region);
      populateSelect(filtered);
      if (filtered.length > 0) renderCountryDetail(filtered[0]);
    });

    init();
  </script>
</body>
</html>
