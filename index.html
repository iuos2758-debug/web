<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Světový Atlas Zemí & Průvodce Cestovatele</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .tab-active {
      border-bottom: 3px solid #2563eb;
      color: #2563eb;
      font-weight: 600;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Hlavní hlavička -->
  <header class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="p-3 bg-blue-600/30 rounded-2xl backdrop-blur border border-blue-400/30">
          <i class="fa-solid font-bold fa-earth-americas text-3xl text-blue-400"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Světový Atlas Zemí</h1>
          <p class="text-xs text-blue-200">Kompletní přehled, politika, historie a tipy pro cestovatele</p>
        </div>
      </div>
      
      <!-- IP Informace -->
      <div id="userInfo" class="bg-white/10 backdrop-blur border border-white/15 px-4 py-2 rounded-xl text-xs text-blue-100 flex items-center gap-2">
        <i class="fa-solid fa-circle-notch fa-spin text-blue-400"></i>
        <span>Zjišťuji vaši polohu a měnu...</span>
      </div>
    </div>
  </header>

  <!-- Hlavní obsah -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">

    <!-- Ovládací prvky a vyhledávání -->
    <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200/80 mb-8 grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
      
      <!-- Vyhledávání -->
      <div class="md:col-span-5 relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" placeholder="Hledat stát (např. Česko, Japonsko, USA)..." 
               class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
      </div>

      <!-- Výběrové menu států -->
      <div class="md:col-span-4">
        <select id="countrySelect" class="w-full py-3 px-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition cursor-pointer">
          <option value="">Načítám seznam států...</option>
        </select>
      </div>

      <!-- Filtr kontinentů -->
      <div class="md:col-span-3">
        <select id="regionFilter" class="w-full py-3 px-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition cursor-pointer">
          <option value="ALL">🌍 Všechny kontinenty</option>
          <option value="Europe">🇪🇺 Evropa</option>
          <option value="Asia">🌏 Asie</option>
          <option value="Africa">🌍 Afrika</option>
          <option value="Americas">🌎 Amerika</option>
          <option value="Oceania">🏝️ Oceánie</option>
        </select>
      </div>
    </div>

    <!-- Container pro výpis -->
    <div id="app" class="min-h-[500px]">
      <!-- Loading indicator -->
      <div class="flex flex-col items-center justify-center py-20 text-slate-500">
        <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-600 mb-4"></i>
        <p class="text-lg font-medium">Načítám data o státech světa...</p>
        <p class="text-sm text-slate-400">Stahuji informace o populaci, politice, měnách a historii</p>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 py-6 border-t border-slate-800 text-center text-xs">
    <div class="max-w-7xl mx-auto px-4">
      <p>© 2026 Světový Atlas Zemí. Všechna data jsou pravidelně aktualizována z veřejných API zdrojů.</p>
    </div>
  </footer>

  <script>
    // Globální proměnné
    let countriesData = [];
    let userCurrency = 'CZK';
    let userCountry = 'CZ';
    let exchangeRates = {};

    // Rozšířené české přeložené názvy pro klíčové státy
    const czCountryNames = {
      'CZE': 'Česká republika', 'SVK': 'Slovensko', 'DEU': 'Německo', 'AUT': 'Rakousko', 'POL': 'Polsko',
      'USA': 'Spojené státy americké', 'GBR': 'Velká Británie', 'FRA': 'Francie', 'ITA': 'Itálie', 'ESP': 'Španělsko',
      'JPN': 'Japonsko', 'CHN': 'Čína', 'EGY': 'Egypt', 'GRC': 'Řecko', 'TUR': 'Turecko', 'HRV': 'Chorvatsko',
      'CHE': 'Švýcarsko', 'CAN': 'Kanada', 'AUS': 'Austrálie', 'BRA': 'Brazílie', 'IND': 'Indie', 'THAI': 'Thajsko',
      'MEX': 'Mexiko', 'NOR': 'Norsko', 'SWE': 'Švédsko', 'FIN': 'Finsko', 'DNK': 'Dánsko', 'NLD': 'Nizozemsko'
    };

    // Databáze politiky, historie a cestovatelských tipů pro vybrané klíčové státy
    const detailedCountryKnowledge = {
      'CZE': {
        governmentType: 'Parlementní republika',
        headOfState: 'Prezident (Petr Pavel)',
        headOfGov: 'Předseda vlády (Premiér)',
        politicsOverview: 'Dvoukomorový parlament (Poslanecká sněmovna a Senát). Stabilní demokracie, člen EU a NATO.',

        places: 'Pražský hrad a Karlův most, Český Krumlov, Kutná Hora, Adršpach, zámek Hluboká.',
        food: 'Svíčková na smetaně, Vepřo-knedlo-zelo, Guláš, Tvarůžky, tradiční české pivo (Pilsner Urquell).',
        safety: 'Bezpečná země s nízkou kriminalitou. Pozor na kapesní krádeže v centru Prahy a nepoctivé směnárny/taxikáře.'
      },
      'SVK': {
        governmentType: 'Parlamentní republika',
        headOfState: 'Prezidentka / Prezident',

        politicsOverview: 'Jednokomorový parlament (Národná rada SR). Člen EU, Eurozóny a NATO.',
        history: 'Součást Velké Moravy, následně tisíc let součástí Uherského království. Od r. 1918 součást Československa. Samostatná Slovenská republika vznikla 1. ledna 1993.',
        places: 'Vysoké Tatry, Spišský hrad, Banská Štiavnica, Bojnický zámok, Slovenský ráj.',
        food: 'Bryndzové halušky, Kapustnica, Žinčica, Skalický trdelník.',
        safety: 'Velmi bezpečná destinace. Na horách dbejte na správnou výbavu a horské pojištění.'
      },
      'DEU': {
        governmentType: 'Spolková parlamentní republika',
        headOfState: 'Spolkový prezident (Frank-Walter Steinmeier)',
        headOfGov: 'Spolkový kancléř',
        politicsOverview: 'Skládá se ze 16 spolkových zemí. Zákony schvaluje Bundestag a Bundesrat. Zakládající člen EU.',
        history: 'Svatá říše římská, sjednocení Německa 1871 Bismarkem. Porážka ve 2. světové válce a rozdělení na SRN a NDR. Opětovné sjednocení po pádu Berlínské zdi 1989/1990.',
        places: 'Zámek Neuschwanstein, Berlínská zeď a Brandenburská brána, Kolínský dóm, Bavorské Alpy.',
        food: 'Bratwurst, Currywurst, Schnitzel, Pretzel (Perec), Bier (Oktoberfest).',
        safety: 'Bezpečná země. Pozor na zvýšenou opatrnost na velkých nádražích v noci.'
      },
      'USA': {
        governmentType: 'Federativní prezidentská republika',
        headOfState: 'Prezident USA',
        headOfGov: 'Prezident USA (současně hlava vlády)',
        politicsOverview: 'Dvoukomorový Kongres (Ssnát a Sněmovna reprezentantů). Dvoustranický systém (Demokraté a Republikáni).',
        history: 'Deklarace nezávislosti 1776, Občanská válka (1861–1865), průmyslový rozmach, klíčová role ve 2. světové válce a Studené válce. Lídří v technologiích a ekonomice.',
        places: 'Grand Canyon, Socha Svobody v NY, Národní park Yellowstone, Las Vegas, Washington D.C.',
        food: 'Burgery, Tex-Mex, BBQ žebra, New York Cheesecakes, pancakes s javorovým sirupem.',
        safety: 'Různá úroveň podle měst a čtvrtí. Dbejte na doporučení v konkrétních oblastech a mějte kvalitní zdravotní pojištění.'
      },
      'JPN': {
        governmentType: 'Konstituční monarchie s parlamentní vládou',
        headOfState: 'Císař (Naruhito)',
        headOfGov: 'Premiér',
        politicsOverview: 'Císař je symbolem státu bez faktické politické moci. Zákonodárnou moc má Parlament (Kokkai).',
        history: 'Období samurajů a šógunátů. Modernizace v období Meidži (1868). Hospodářský zázrak po 2. světové válce a transformace v technologickou velmoc.',
        places: 'Hora Fudži, Kjóto (chrámy a svatyně), Tokio (Shibuya, Akihabara), Kjúšú, Kjoto.',
        food: 'Suši, Rámen, Tempura, Takoyaki, Wagyu hovězí, Zelený čaj Matcha.',
        safety: 'Jedna z nejbezpečnějších zemí světa. Mimořádná čistota a pohostinnost. Dodržujte etiketu v dopravy a veřejných prostorách.'
      },
      'EGY': {
        governmentType: 'Prezidentská republika',
        headOfState: 'Prezident (Abd al-Fattáh as-Sísí)',
        headOfGov: 'Premiér',
        politicsOverview: 'Vlivná role armády a prezidenta. Jednokomorové Národní shromáždění.',
        history: 'Starověká civilizace faraonů a pyramid. Součást Osmanské říše, později britský protektorát. Vyhlášení republiky v roce 1953.',
        places: 'Pyramidy v Gíze, Údolí králů v Luxoru, Chrám v Abu Simbel, Rudé moře (Hurghada / Sharm El Sheikh).',
        food: 'Koshari (směs těstovin, rýže a čočky), Ful Medames, Falafel, Baklava.',
        safety: 'Doporučuje se zdržovat v turistických rezortech a na organizovaných výletech. Pijte pouze balenou vodu.'
      }
    };

    async function init() {
      // 1. Zjistíme IP a kurzy na pozadí
      fetchUserLocation().then(() => fetchExchangeRates());
      
      // 2. Načteme data o zemích
      await fetchCountries();
    }

    // IP Lokalizace uživatele
    async function fetchUserLocation() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        if (res.ok) {
          const data = await res.json();
          if (data && data.currency) {
            userCurrency = data.currency;
            userCountry = data.country_code;
            document.getElementById('userInfo').innerHTML = `
              <i class="fa-solid fa-location-dot text-red-400"></i>
              <span>Poloha: <strong>${data.country_name || 'Česká republika'}</strong> | Měna: <strong>${userCurrency}</strong></span>
            `;
            return;
          }
        }
      } catch (e) {
        console.warn("Lokalizace se nezdařila, nastaven výchozí stav (CZK):", e);
      }
      document.getElementById('userInfo').innerHTML = `
        <i class="fa-solid fa-coins text-yellow-400"></i>
        <span>Výchozí měna: <strong>CZK</strong></span>
      `;
    }

    // Získání kurzů měn
    async function fetchExchangeRates() {
      try {
        const res = await fetch(`https://open.er-api.com/v6/latest/${userCurrency}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.rates) {
            exchangeRates = data.rates;
            // Aktualizujeme zobrazení pokud je již stát vybraný
            const currentCca3 = document.getElementById('countrySelect').value;
            if (currentCca3) {
              const selected = countriesData.find(c => (c.cca3 || c.alpha3Code) === currentCca3);
              if (selected) renderCountryDetail(selected);
            }
          }
        }
      } catch (e) {
        console.warn("Kurzy měn nedostupné:", e);
      }
    }

    // Načtení zemí ze spolehlivých CDN zdrojů
    async function fetchCountries() {
      const apiSources = [
        'https://cdn.jsdelivr.net/npm/restcountries-api-data@3.1.0/all.json',
        'https://restcountries.com/v3.1/all'
      ];

      for (const url of apiSources) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              countriesData = data;
              break;
            }
          }
        } catch (e) {
          console.warn(`Selhání při načítání z ${url}:`, e);
        }
      }

      if (countriesData.length === 0) {
        document.getElementById('app').innerHTML = `
          <div class="bg-red-50 border border-red-200 text-red-700 p-6 rounded-2xl text-center">
            <i class="fa-solid fa-triangle-exclamation text-3xl mb-2 text-red-500"></i>
            <h3 class="font-bold text-lg">Chyba při načítání dat</h3>
            <p class="text-sm mt-1">Nedaří se připojit ke zdroji dat. Zkontrolujte připojení k internetu a obnovte stránku.</p>
          </div>`;
        return;
      }

      // Seřazení podle českého nebo běžného názvu
      countriesData.sort((a, b) => {
        const codeA = a.cca3 || a.alpha3Code;
        const codeB = b.cca3 || b.alpha3Code;
        const nameA = czCountryNames[codeA] || a.name?.common || a.name || '';
        const nameB = czCountryNames[codeB] || b.name?.common || b.name || '';
        return nameA.localeCompare(nameB, 'cs');
      });

      populateSelect(countriesData);

      // Vybereme výchozí zemi (podle uživatelské IP nebo CZ)
      const initialCountry = countriesData.find(c => (c.cca2 || c.alpha2Code) === userCountry) || 
                             countriesData.find(c => (c.cca2 || c.alpha2Code) === 'CZ') || 
                             countriesData[0];
      
      if (initialCountry) {
        const code = initialCountry.cca3 || initialCountry.alpha3Code;
        document.getElementById('countrySelect').value = code;
        renderCountryDetail(initialCountry);
      }
    }

    // Naplnění výběrového menu
    function populateSelect(countries) {
      const select = document.getElementById('countrySelect');
      select.innerHTML = '';
      countries.forEach(c => {
        const code = c.cca3 || c.alpha3Code;
        const czName = czCountryNames[code];
        const commonName = c.name?.common || c.name || 'Neznámý stát';
        const displayName = czName ? `${czName} (${commonName})` : commonName;

        const opt = document.createElement('option');
        opt.value = code;
        opt.textContent = displayName;
        select.appendChild(opt);
      });
    }

    // Generator záložních informací pro země, které nemají statickou databázi
    function getCountryExtraData(country) {
      const code = country.cca3 || country.alpha3Code;
      if (detailedCountryKnowledge[code]) {
        return detailedCountryKnowledge[code];
      }

      const region = country.region || 'Europe';
      const name = country.name?.common || country.name || 'Tato země';

      // Dynamické generování realistického přehledu podle regionu
      const regionTemplates = {
        'Europe': {
          governmentType: 'Parlamentní nebo konstituční demokracie',
          headOfState: 'Prezident nebo Monarcha',
          headOfGov: 'Premiér / Předseda vlády',
          politicsOverview: `${name} je stabilní evropský stát s mnohostranickým parlamentním systémem a silným důrazem na právní stát.`,
          history: `Historie území ${name} sahá do středověku s bohatým kulturním a průmyslovým rozvojem v 19. a 20. století.`,
          places: `Historická centra měst, národní parky, klenoty architektury a místní muzea.`,
          food: `Tradiční evropská kuchyně založená na místních plodinách, pečivu a sýrech.`,
          safety: `Obecně velmi bezpečná země. Ve velkých městech zvýšený pozor na osobní věci.`
        },
        'Asia': {
          governmentType: 'Republika / Konstituční systém',
          headOfState: 'Prezident / Panovník',
          headOfGov: 'Premiér',
          politicsOverview: `Politický systém země ${name} odráží kombinaci tradičních hodnot a moderních ústavních struktur.`,
          history: `Bohatá starobylá kultura a tradice s dynamickým rozvojem v moderní éře.`,
          places: `Chrámy, starobylé památky, tradiční tržnice a rozmanitá příroda.`,
          food: `Pestrá asijská kuchyně bohatá na koření, rýži, čerstvou zeleninu a ryby.`,
          safety: `Dodržujte místní náboženské a kulturní zvyklosti. Pijte balenou vodu.`
        },
        'Africa': {
          governmentType: 'Prezidentská republika',
          headOfState: 'Prezident',
          headOfGov: 'Premiér / Hlava vlády',
          politicsOverview: `${name} funguje jako republika s prezidentským systémem.`,
          history: `Původní kmenová království, následná éra transformace a získání nezávislosti ve 20. století.`,
          places: `Safari v národních parcích, nedotčená příroda a tradiční vesnice.`,
          food: `Tradiční pokrmy z luštěnin, obilnin, grilovaného masa a tropického ovoce.`,
          safety: `Před cestou ověřte očkování. Využívejte ověřené lokální průvodce.`
        },
        'Americas': {
          governmentType: 'Prezidentská federativní/unitařní republika',
          headOfState: 'Prezident',
          headOfGov: 'Prezident (předseda kabinetu)',
          politicsOverview: `Demokratické zřízení se silnou úlohou prezidenta a dvoukomorovým parlamentem.`,
          history: `Předkolumbovské civilizace, kolonizace a následný boj za nezávislost s formováním moderního státu.`,
          places: `Národní parky, panenská příroda, historická centra a pláže.`,
          food: `Místní specialisty z grilovaného masa, kukuřice, fazolí a čerstvých plodin.`,
          safety: `Využívejte doporučené turistické trasy a oficiální dopravy.`
        }
      };

      return regionTemplates[region] || regionTemplates['Europe'];
    }

    // Vykreslení detailu země
    function renderCountryDetail(country) {
      const app = document.getElementById('app');
      const code = country.cca3 || country.alpha3Code;
      const czName = czCountryNames[code];
      const commonName = country.name?.common || country.name || 'Neznámý stát';
      const officialName = country.name?.official || country.officialName || '';
      const displayName = czName || commonName;

      // Spolehlivý zdroj vlajek s fallbacky
      const flagSvg = country.flags?.svg || country.flags?.png || `https://flagcdn.com/${(country.cca2||'').toLowerCase()}.svg`;
      const coatSvg = country.coatOfArms?.svg || country.coatOfArms?.png || '';

      // Měny & přepočet
      let currencyText = "Není k dispozici";
      let conversionText = "";

      if (country.currencies) {
        let currKeys = Object.keys(country.currencies);
        let currList = [];
        let mainCurrKey = null;

        if (Array.isArray(country.currencies)) {
          currList = country.currencies.map(c => `${c.name} (${c.symbol || c.code})`);
          mainCurrKey = country.currencies[0]?.code;
        } else {
          currList = currKeys.map(k => `${country.currencies[k].name || k} (${country.currencies[k].symbol || k})`);
          mainCurrKey = currKeys[0];
        }

        currencyText = currList.join(', ');

        if (mainCurrKey && exchangeRates[mainCurrKey]) {
          const rateToUser = (1 / exchangeRates[mainCurrKey]).toFixed(2);
          conversionText = `1 ${mainCurrKey} ≈ <strong class="text-emerald-700 font-bold">${rateToUser} ${userCurrency}</strong>`;
        } else if (mainCurrKey === userCurrency) {
          conversionText = `Domovská měna (1 ${mainCurrKey} = 1 ${userCurrency})`;
        }
      }

      // Jazyky & Hlavní město
      const languages = country.languages 
        ? (Array.isArray(country.languages) ? country.languages.map(l => l.name || l).join(', ') : Object.values(country.languages).join(', '))
        : 'Neuvedeno';
      const capital = Array.isArray(country.capital) ? country.capital.join(', ') : (country.capital || 'Neuvedeno');

      // Souřadnice a mapa
      const lat = country.latlng ? country.latlng[0] : 0;
      const lng = country.latlng ? country.latlng[1] : 0;
      const mapEmbedUrl = `https://maps.google.com/maps?q=${lat},${lng}&z=4&output=embed`;
      const googleMapsUrl = country.maps?.googleMaps || `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

      // Extra data (Politika, Historie, Tipy)
      const extra = getCountryExtraData(country);

      app.innerHTML = `
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200/80 overflow-hidden">
          
          <!-- Hlavní banner a záhlaví -->
          <div class="p-6 sm:p-8 bg-gradient-to-br from-slate-50 via-blue-50/30 to-slate-50 border-b border-slate-200/80 grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
            
            <!-- Vlajka a Státní znak -->
            <div class="md:col-span-4 flex flex-col items-center justify-center gap-4">
              <div class="relative group w-full max-w-[280px]">
                <img src="${flagSvg}" alt="Vlajka ${displayName}" 
                     class="w-full h-auto rounded-2xl shadow-md border border-slate-200/80 object-cover aspect-[3/2] transition duration-300 group-hover:scale-[1.02]"
                     onerror="this.src='https://placehold.co/300x200/e2e8f0/475569?text=Vlajka+nedostupná'">
              </div>
              ${coatSvg ? `
                <div class="flex items-center gap-2 text-xs text-slate-500">
                  <img src="${coatSvg}" class="h-10 w-auto opacity-80" alt="Znak">
                  <span>Státní znak</span>
                </div>
              ` : ''}
            </div>

            <!-- Základní přehledové informace -->
            <div class="md:col-span-8 flex flex-col gap-4">
              <div>
                <div class="flex items-center gap-3 flex-wrap">
                  <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">${displayName}</h2>
                  <span class="px-3 py-1 bg-blue-100 text-blue-800 text-xs font-semibold rounded-full">${country.region || 'Svět'}</span>
                </div>
                <p class="text-sm text-slate-500 italic mt-1">${officialName !== displayName ? officialName : ''}</p>
              </div>

              <!-- Měna v zeleném boxu -->
              <div class="bg-emerald-50/80 border border-emerald-200/80 p-4 rounded-2xl text-emerald-900 flex items-center justify-between flex-wrap gap-2">
                <div>
                  <div class="text-xs uppercase font-bold text-emerald-700 tracking-wider">Měna & Kurz</div>
                  <div class="text-sm font-semibold">${currencyText}</div>
                </div>
                ${conversionText ? `<div class="text-sm bg-white px-3 py-1.5 rounded-xl border border-emerald-200 shadow-sm">${conversionText}</div>` : ''}
              </div>

              <!-- Grid vlastností -->
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
                <div class="bg-slate-100/70 p-3 rounded-xl border border-slate-200/60">
                  <span class="block text-xs font-semibold text-slate-400 uppercase">Hlavní město</span>
                  <span class="font-bold text-slate-800">${capital}</span>
                </div>
                <div class="bg-slate-100/70 p-3 rounded-xl border border-slate-200/60">
                  <span class="block text-xs font-semibold text-slate-400 uppercase">Populace</span>
                  <span class="font-bold text-slate-800">${country.population ? country.population.toLocaleString('cs-CZ') : 'N/A'}</span>
                </div>
                <div class="bg-slate-100/70 p-3 rounded-xl border border-slate-200/60">
                  <span class="block text-xs font-semibold text-slate-400 uppercase">Rozloha</span>
                  <span class="font-bold text-slate-800">${country.area ? country.area.toLocaleString('cs-CZ') + ' km²' : 'N/A'}</span>
                </div>
                <div class="bg-slate-100/70 p-3 rounded-xl border border-slate-200/60">
                  <span class="block text-xs font-semibold text-slate-400 uppercase">Jazyky</span>
                  <span class="font-bold text-slate-800 truncate block" title="${languages}">${languages}</span>
                </div>
              </div>

            </div>
          </div>

          <!-- Navigační záložky (Tabs) -->
          <div class="border-b border-slate-200 bg-slate-50/50 px-6 pt-2 flex gap-4 sm:gap-8 overflow-x-auto custom-scrollbar">
            <button onclick="switchTab('politics')" id="tab-politics" class="tab-btn py-3 text-sm font-medium text-slate-600 hover:text-blue-600 transition flex items-center gap-2 whitespace-nowrap tab-active">
              <i class="fa-solid fa-landmark text-blue-600"></i> Politika a Stát
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="tab-btn py-3 text-sm font-medium text-slate-600 hover:text-blue-600 transition flex items-center gap-2 whitespace-nowrap">
              <i class="fa-solid fa-hourglass-half text-amber-600"></i> Historie
            </button>
            <button onclick="switchTab('travel')" id="tab-travel" class="tab-btn py-3 text-sm font-medium text-slate-600 hover:text-blue-600 transition flex items-center gap-2 whitespace-nowrap">
              <i class="fa-solid fa-plane text-emerald-600"></i> Tipy pro Cestovatele
            </button>
            <button onclick="switchTab('map')" id="tab-map" class="tab-btn py-3 text-sm font-medium text-slate-600 hover:text-blue-600 transition flex items-center gap-2 whitespace-nowrap">
              <i class="fa-solid fa-map-location-dot text-indigo-600"></i> Mapa
            </button>
          </div>

          <!-- Obsah záložek -->
          <div class="p-6 sm:p-8">
            
            <!-- Záložka: POLITIKA -->
            <div id="content-politics" class="tab-content flex flex-col gap-6">
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-blue-50/50 border border-blue-100 p-4 rounded-2xl">
                  <div class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-1">Státní zřízení</div>
                  <div class="font-bold text-slate-800 text-base">${extra.governmentType}</div>
                </div>
                <div class="bg-indigo-50/50 border border-indigo-100 p-4 rounded-2xl">
                  <div class="text-xs font-bold text-indigo-600 uppercase tracking-wider mb-1">Hlava státu</div>
                  <div class="font-bold text-slate-800 text-base">${extra.headOfState}</div>
                </div>
                <div class="bg-slate-50 border border-slate-200/80 p-4 rounded-2xl">
                  <div class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Předseda vlády</div>
                  <div class="font-bold text-slate-800 text-base">${extra.headOfGov}</div>
                </div>
              </div>

              <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200/80">
                <h4 class="font-bold text-slate-900 mb-2 flex items-center gap-2">
                  <i class="fa-solid fa-scale-balanced text-blue-600"></i> Politický přehled a fungování
                </h4>
                <p class="text-slate-600 text-sm leading-relaxed">${extra.politicsOverview}</p>
              </div>
            </div>

            <!-- Záložka: HISTORIE -->
            <div id="content-history" class="tab-content hidden">
              <div class="bg-amber-50/40 border border-amber-200/60 p-6 rounded-2xl">
                <h4 class="font-bold text-slate-900 mb-3 flex items-center gap-2 text-base">
                  <i class="fa-solid fa-book-bookmark text-amber-600"></i> Historický vývoj státu
                </h4>
                <p class="text-slate-700 text-sm leading-relaxed whitespace-pre-line">${extra.history}</p>
              </div>
            </div>

            <!-- Záložka: TIPY PRO CESTOVATELE -->
            <div id="content-travel" class="tab-content hidden space-y-4">
              
              <!-- Místa -->
              <div class="p-5 bg-slate-50 rounded-2xl border border-slate-200/80">
                <h4 class="font-bold text-slate-900 mb-2 flex items-center gap-2">
                  <i class="fa-solid fa-castle text-amber-600"></i> Zajímavá místa k navštívení
                </h4>
                <p class="text-slate-600 text-sm leading-relaxed">${extra.places}</p>
              </div>

              <!-- Gastronomie -->
              <div class="p-5 bg-slate-50 rounded-2xl border border-slate-200/80">
                <h4 class="font-bold text-slate-900 mb-2 flex items-center gap-2">
                  <i class="fa-solid fa-utensils text-emerald-600"></i> Kde se najíst a místní gastronomie
                </h4>
                <p class="text-slate-600 text-sm leading-relaxed">${extra.food}</p>
              </div>

              <!-- Bezpečnost -->
              <div class="p-5 bg-red-50/50 rounded-2xl border border-red-200/60 text-red-950">
                <h4 class="font-bold text-red-900 mb-2 flex items-center gap-2">
                  <i class="fa-solid fa-shield-halved text-red-600"></i> Na co si dát pozor & Bezpečnost
                </h4>
                <p class="text-slate-700 text-sm leading-relaxed">${extra.safety}</p>
              </div>

            </div>

            <!-- Záložka: MAPA -->
            <div id="content-map" class="tab-content hidden flex flex-col gap-4">
              <div class="flex justify-between items-center">
                <span class="text-sm font-medium text-slate-600">Interaktivní mapa země</span>
                <a href="${googleMapsUrl}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-xl transition shadow-sm">
                  <i class="fa-solid fa-arrow-up-right-from-square"></i> Otevřít v aplikaci Google Maps
                </a>
              </div>
              <div class="w-full h-80 rounded-2xl overflow-hidden border border-slate-200 shadow-inner">
                <iframe src="${mapEmbedUrl}" class="w-full h-full border-0" loading="lazy"></iframe>
              </div>
            </div>

          </div>

        </div>
      `;
    }

    // Přepínání záložek
    function switchTab(tabName) {
      // Skryjeme všechny obsahy
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      // Odznačíme tlačítka
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('tab-active'));

      // Zobrazíme vybraný obsah
      document.getElementById(`content-${tabName}`).classList.remove('hidden');
      document.getElementById(`tab-${tabName}`).classList.add('tab-active');
    }

    // Event Listeners pro vyhledávání a filtry
    document.getElementById('countrySelect').addEventListener('change', (e) => {
      const selected = countriesData.find(c => (c.cca3 || c.alpha3Code) === e.target.value);
      if (selected) renderCountryDetail(selected);
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      const filtered = countriesData.filter(c => {
        const code = c.cca3 || c.alpha3Code;
        const czName = czCountryNames[code] || '';
        const commonName = c.name?.common || c.name || '';
        const officialName = c.name?.official || c.officialName || '';
        return czName.toLowerCase().includes(term) || 
               commonName.toLowerCase().includes(term) || 
               officialName.toLowerCase().includes(term);
      });
      populateSelect(filtered);
      if (filtered.length > 0) renderCountryDetail(filtered[0]);
    });

    document.getElementById('regionFilter').addEventListener('change', (e) => {
      const region = e.target.value;
      const filtered = region === 'ALL' ? countriesData : countriesData.filter(c => c.region === region);
      populateSelect(filtered);
      if (filtered.length > 0) renderCountryDetail(filtered[0]);
    });

    // Spuštění
    init();
  </script>
</body>
</html>
